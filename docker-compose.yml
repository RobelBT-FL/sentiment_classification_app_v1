version: "3.9"

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.localCompose
    container_name: backend
    ports:
      - "8000:8000"
    environment:
      #API_JWT_SECRET: ${API_JWT_SECRET}
      MODEL_PATH: /app/models/llama-2-7b-chat-hf-q4_k_m.gguf
      DATA_PATH: /app/data/imdb.csv
      QDRANT_URL: http://qdrant:6333
      CHROMA_URL: http://chromadb:8000
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./backend/app:/app/app
    depends_on:
      - redis
      - db
      - qdrant
      - chromadb

  frontend:
    build:
      context: ./frontend-next
      dockerfile: Dockerfile.localCompose
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  db:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sentiment
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma

volumes:
  postgres_data:
  qdrant_data:
  chroma_data:

