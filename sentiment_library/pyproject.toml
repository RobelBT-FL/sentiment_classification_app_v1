[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "sentiment_class_library_tool_v1"
version = "0.1.0"
description = "A local LLaMA-based sentiment classification library with zero-shot, few-shot, and CoT evaluation."
authors = [
    { name = "Robel Berhe" }
]
readme = "README.md"
requires-python = ">=3.10"

# -----------------------------
# LIBRARY-ONLY DEPENDENCIES
# -----------------------------
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "datasets>=2.14",
    "llama-cpp-python>=0.2.20",
    "huggingface_hub>=0.20",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "loguru>=0.7"
]


[project.urls]
Homepage = "https://github.com/yourusername/sentiment_classification_package_library_v2"
Documentation = "https://github.com/yourusername/sentiment_classification_package_library_v2"
Source = "https://github.com/yourusername/sentiment_classification_package_library_v2"


[tool.setuptools.packages.find]
where = ["src"]
