name: Frontend - Build and Deploy to Azure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  ACR_IMAGE: ${{ secrets.ACR_LOGIN_SERVER }}/frontend-docker-sentiment

jobs:
  build-and-push-frontend:
    name: Build Frontend Image → Push to ACR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: |
            ${{ env.ACR_IMAGE }}:latest

  deploy-frontend:
    name: Deploy Frontend to Azure Container Apps
    needs: build-and-push-frontend
    runs-on: ubuntu-latest

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: sentiment-frontend-app
          resourceGroup: sentimentmyresoursehelen2012
          imageToDeploy: ${{ env.ACR_IMAGE }}:latest
          environmentVariables: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
